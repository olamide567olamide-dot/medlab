<!-- login.html - Fully integrated with backend API -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UNIFY MEDIC</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231D5A76'/%3E%3Cpath d='M19 15v19a13 13 0 0 0 26 0V15' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round'/%3E%3Cpath d='M32 24v14M25 31h14' stroke='%23E8896B' stroke-width='4.6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #0E3B47;
            --teal: #2B7A9D;
            --teal-deep: #1D5A76;
            --aqua: #8FE0D3;
            --aqua-soft: #E4F6F2;
            --sand: #F7F5F0;
            --sand-deep: #EFEBE2;
            --coral: #E8896B;
            --coral-soft: #FBEAE4;
            --line: #DDD8CC;
            --radius-s: 10px;
            --radius-m: 16px;
            --radius-l: 28px;
            --font-display: 'Fraunces', serif;
            --font-body: 'Inter', 'Segoe UI', sans-serif;
            --primary-color: var(--teal);
            --primary-dark: var(--teal-deep);
            --accent-blue: var(--aqua);
            --light-bg: var(--sand);
            --white: #FFFFFF;
            --text-dark: var(--ink);
            --text-light: var(--teal-deep);
            --border-color: var(--line);
            --transition: all 0.3s ease;
            --success-color: var(--aqua);
        }

        html {
            scroll-behavior: smooth;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-dark);
            line-height: 1.6;
            background: linear-gradient(135deg, var(--sand) 0%, var(--aqua-soft) 100%);
            min-height: 100vh;
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 2rem;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-display);
            font-weight: 500;
        }

        .site-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: var(--white);
            border-bottom: 1px solid var(--line);
            z-index: 10;
        }

        .site-nav .navbar-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--ink);
            font: 500 1.35rem var(--font-display);
            text-decoration: none;
        }

        .site-nav .logo-icon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: var(--radius-s);
            color: var(--ink);
            background: linear-gradient(135deg, var(--teal), var(--aqua));
            font: 600 0.9rem var(--font-body);
        }

        .site-nav .nav-cta {
            padding: 0.65rem 1.15rem;
            border-radius: 999px;
            background: var(--ink);
            color: var(--white);
            text-decoration: none;
            font: 600 0.9rem var(--font-body);
            transition: var(--transition);
        }

        .site-nav .nav-cta:hover {
            background: var(--teal-deep);
            transform: translateY(-2px);
        }

        * {
            word-break: break-word;
        }

        .login-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: none;
            max-width: 450px;
            width: 100%;
            padding: 3rem 2rem;
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header .logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            background-color: var(--light-bg);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--white);
            box-shadow: none;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 1rem;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: none;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .api-error {
            background-color: var(--line);
            border-left: 4px solid var(--coral);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--coral);
            display: none;
        }

        .api-error.show {
            display: block;
        }

        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            color: var(--text-light);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

        .signup-link {
            text-align: center;
            color: var(--text-light);
        }

        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .back-link:hover {
            gap: 1rem;
        }

        .error-message {
            color: var(--coral);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        input.error {
            border-color: var(--coral);
            background-color: var(--line);
        }

        @media (max-width: 640px) {
            body {
                padding: 1.2rem;
            }

            .login-container {
                padding: 2rem 1.5rem;
                margin: 0 auto;
                max-width: 100%;
            }

            .login-header h1 {
                font-size: 1.6rem;
            }

            .login-header p {
                font-size: 0.95rem;
            }

            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .login-btn {
                padding: 0.95rem;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 1rem;
            }

            .login-container {
                padding: 1.5rem 1rem;
                border-radius: 16px;
            }

            .login-header .logo {
                font-size: 2rem;
            }

            .login-header h1 {
                font-size: 1.4rem;
            }

            .login-header p,
            .forgot-password,
            .signup-link,
            .remember-forgot {
                font-size: 0.9rem;
            }

            input[type="email"],
            input[type="password"],
            .login-btn {
                font-size: 0.95rem;
            }

            .remember-forgot {
                width: 100%;
            }

            .remember-me {
                flex-wrap: wrap;
            }

            .back-link,
            .signup-link {
                font-size: 0.95rem;
            }
        }

        .login-btn, .signup-btn { border-radius: 999px; background: var(--ink); color: var(--white); }
        .login-btn:hover:not(:disabled), .signup-btn:hover:not(:disabled) { background: var(--teal-deep); transform: translateY(-2px); }
        .login-container, .signup-container { border-radius: var(--radius-m); border: 1px solid var(--line); box-shadow: none; }
                /* Unify Medic brand logo */
                .navbar-logo { display: flex; align-items: center; }
                .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
                .brand-mark { flex: 0 0 auto; display: block; }
                .brand-word { font: 600 1.45rem/1 var(--font-display); color: var(--ink); letter-spacing: -0.01em; }
                .brand-word span { color: var(--teal); margin-left: 0.2em; font-weight: 500; }
                @media (max-width: 480px) {
                    .brand-word { font-size: 1.2rem; }
                    .brand-mark { width: 32px; height: 32px; }
                }
    </style>
</head>
<body>
    <header class="site-nav">
                <div class="navbar-logo">
                        <a href="index.html" class="brand" aria-label="Unify Medic home">
                            <svg class="brand-mark" viewBox="0 0 64 64" width="38" height="38" aria-hidden="true">
                                <defs>
                                    <linearGradient id="um-bg" x1="0" y1="0" x2="1" y2="1">
                                        <stop offset="0" stop-color="#2B7A9D"/>
                                        <stop offset="1" stop-color="#0E3B47"/>
                                    </linearGradient>
                                </defs>
                                <rect width="64" height="64" rx="16" fill="url(#um-bg)"/>
                                <path d="M19 15v19a13 13 0 0 0 26 0V15" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="19" cy="15" r="4.2" fill="#8FE0D3"/>
                                <circle cx="45" cy="15" r="4.2" fill="#8FE0D3"/>
                                <path d="M32 24v14M25 31h14" stroke="#E8896B" stroke-width="4.6" stroke-linecap="round"/>
                            </svg>
                            <span class="brand-word">Unify<span>Medic</span></span>
                        </a>
                </div>
        <a class="nav-cta" href="signup.html">Create account</a>
    </header>
    <div class="login-container">
        <a href="index.html" class="back-link">← Back to Home</a>

        <div class="login-header">
            <a href="index.html" class="brand" aria-label="Unify Medic home">
                <svg class="brand-mark" viewBox="0 0 64 64" width="38" height="38" aria-hidden="true">
                    <defs>
                        <linearGradient id="um-bg" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#2B7A9D"/>
                            <stop offset="1" stop-color="#0E3B47"/>
                        </linearGradient>
                    </defs>
                    <rect width="64" height="64" rx="16" fill="url(#um-bg)"/>
                    <path d="M19 15v19a13 13 0 0 0 26 0V15" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="19" cy="15" r="4.2" fill="#8FE0D3"/>
                    <circle cx="45" cy="15" r="4.2" fill="#8FE0D3"/>
                    <path d="M32 24v14M25 31h14" stroke="#E8896B" stroke-width="4.6" stroke-linecap="round"/>
                </svg>
                <span class="brand-word">Unify<span>Medic</span></span>
            </a>
            <h1>Welcome Back</h1>
            <p>Login to your account to access AI-assisted clinical reasoning and medical learning.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <div class="error-message" id="emailError">Please enter a valid email address</div>
            </div>

            <div class="form-group password-wrapper">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="button" class="password-toggle" id="togglePassword">Show</button>
                <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" name="remember" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
            </div>

            <div class="api-error" id="apiError"></div>

            <button type="submit" class="login-btn" id="loginBtn">Login to Unify Medical AI</button>
        </form>

        <div class="divider">or</div>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create Account</a>
        </div>
    </div>
 <script>
     const API_BASE = ''; // set to the backend's full origin if hosted separately
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const apiError = document.getElementById('apiError');
     const loginBtn = document.getElementById('loginBtn');

        // Email validation
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Password validation
        function validatePassword(password) {
            return password.length >= 6;
        }

        // Real-time email validation
        emailInput.addEventListener('blur', function() {
            if (this.value && !validateEmail(this.value)) {
                this.classList.add('error');
                emailError.classList.add('show');
            } else {
                this.classList.remove('error');
                emailError.classList.remove('show');
            }
        });

        // Real-time password validation
        passwordInput.addEventListener('blur', function() {
            if (this.value && !validatePassword(this.value)) {
                this.classList.add('error');
                passwordError.classList.add('show');
            } else {
                this.classList.remove('error');
                passwordError.classList.remove('show');
            }
        });

        // Form submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let isValid = true;

            // Validate email
            if (!email || !validateEmail(email)) {
                emailInput.classList.add('error');
                emailError.classList.add('show');
                isValid = false;
            } else {
                emailInput.classList.remove('error');
                emailError.classList.remove('show');
            }

            // Validate password
            if (!password || !validatePassword(password)) {
                passwordInput.classList.add('error');
                passwordError.classList.add('show');
                isValid = false;
            } else {
                passwordInput.classList.remove('error');
                passwordError.classList.remove('show');
            }

            if (!isValid) return;

            apiError.textContent = '';
            apiError.classList.remove('show');

            try {
                loginBtn.textContent = 'Logging in...';
                loginBtn.disabled = true;

                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success) {
                    apiError.textContent = 'Invalid email or password. Please try again or sign up for a new account.';
                    apiError.classList.add('show');
                    loginBtn.textContent = 'Login to Unify Medical AI';
                    loginBtn.disabled = false;
                    return;
                }

                const user = data.user;
                const storedProfiles = JSON.parse(localStorage.getItem('userProfiles') || '[]');
                const cachedProfile = storedProfiles.find(profile => profile.email?.toLowerCase() === user.email.toLowerCase()) || {};
                const fullName = `${user.firstName} ${user.lastName}`.trim();
                const mergedProfile = { ...cachedProfile, ...user, fullName };
                delete mergedProfile.password;
                localStorage.setItem('currentUserId', user.id);
                localStorage.setItem('currentUserEmail', user.email);
                localStorage.setItem('currentUserProfile', JSON.stringify(mergedProfile));
                localStorage.setItem('userName', fullName);
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } catch (error) {
                apiError.textContent = 'Network error. Please check your connection and try again.';
                apiError.classList.add('show');
                loginBtn.textContent = 'Login to Unify Medical AI';
                loginBtn.disabled = false;
            }
        });

        // Clear errors on input
        emailInput.addEventListener('input', function() {
            this.classList.remove('error');
            emailError.classList.remove('show');
            apiError.textContent = '';
            apiError.classList.remove('show');
        });

        passwordInput.addEventListener('input', function() {
            this.classList.remove('error');
            passwordError.classList.remove('show');
            apiError.textContent = '';
            apiError.classList.remove('show');
        });

        const togglePasswordButton = document.getElementById('togglePassword');
        togglePasswordButton.addEventListener('click', function() {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            this.textContent = isHidden ? 'Hide' : 'Show';
            passwordInput.focus();
        });
    </script>
