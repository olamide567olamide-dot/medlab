<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Reset Password - iMEDIC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231D5A76'/%3E%3Cpath d='M19 15v19a13 13 0 0 0 26 0V15' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round'/%3E%3Cpath d='M32 24v14M25 31h14' stroke='%23E8896B' stroke-width='4.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #0E3B47;
      --teal: #2B7A9D;
      --font-display: 'Fraunces', serif;
      --primary-color: #2b7a9d;
      --primary-dark: #1f5a7a;
      --light-bg: #f5f9fb;
      --white: #ffffff;
      --text-dark: #333333;
      --text-light: #666666;
      --border-color: #e0e0e0;
      --transition: all 0.3s ease;
      --success-color: #10b981;
    }
    html {
      width: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-dark);
      line-height: 1.6;
      background: linear-gradient(135deg, #f5f9fb 0%, #e8f4f8 100%);
      min-height: 100vh;
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 450px;
      width: 100%;
      padding: 3rem 2rem;
    }
    .header { text-align: center; margin-bottom: 2rem; }
    .logo { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; margin-bottom: .5rem; }
    p { color: var(--text-light); font-size: .95rem; }
    .form-group { margin: 1.2rem 0; }
    label { display:block; margin-bottom:.6rem; font-weight:600; }
    input[type="password"]{
      width:100%; padding:1rem; border:2px solid var(--border-color); border-radius:10px;
      font-size:1rem; font-family:inherit; transition:var(--transition); background-color:var(--light-bg);
    }
    input[type="password"]:focus{
      outline:none; border-color:var(--primary-color); background-color:var(--white);
      box-shadow:0 0 0 4px rgba(43,122,157,.1);
    }
    .error { border-color:#dc2626 !important; background-color:rgba(220,38,38,.05) !important; }
    .error-message { color:#dc2626; font-size:.85rem; margin-top:.5rem; display:none; }
    .error-message.show { display:block; }
    .btn{
      width:100%; padding:1rem; background:linear-gradient(135deg,var(--primary-color) 0%, var(--primary-dark) 100%);
      color:var(--white); border:none; border-radius:10px; font-weight:700; font-size:1rem; cursor:pointer;
      transition:var(--transition); margin-top:.6rem;
    }
    .btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 10px 30px rgba(43,122,157,.3); }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
    .success-message{
      display:none; background:rgba(16,185,129,.1); color:var(--success-color);
      padding:1.2rem; border-radius:10px; text-align:center; margin-top:1rem;
    }
    .success-message.show{ display:block; }
    .back { display:block; text-align:center; margin-top:1.5rem; }
    .back a { color:var(--primary-color); text-decoration:none; font-weight:600; }
    .back a:hover { text-decoration:underline; }

    @media (max-width: 640px) {
      body {
        padding: 1.2rem;
      }
      .container {
        padding: 2rem 1.5rem;
        margin: 0 auto;
        max-width: 100%;
      }
      .logo {
        font-size: 2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      p,
      .back a,
      .error-message,
      .success-message {
        font-size: 0.95rem;
      }
      .btn {
        padding: 0.95rem;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 1rem;
      }
      .container {
        padding: 1.5rem 1rem;
        border-radius: 16px;
      }
      .logo {
        font-size: 1.8rem;
      }
      h1 {
        font-size: 1.35rem;
      }
      .form-group {
        margin: 1rem 0;
      }
    }
    /* Unify Medic brand logo */
    .navbar-logo { display: flex; align-items: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-mark { flex: 0 0 auto; display: block; }
    .brand-word { font: 600 1.45rem/1 var(--font-display); color: var(--ink); letter-spacing: -0.01em; }
    .brand-word span { color: var(--teal); margin-left: 0.2em; font-weight: 500; }
    @media (max-width: 480px) {
      .brand-word { font-size: 1.2rem; }
      .brand-mark { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="navbar-logo">
        <a href="index.html" class="brand" aria-label="Unify Medic home">
          <svg class="brand-mark" viewBox="0 0 64 64" width="38" height="38" aria-hidden="true">
            <defs>
              <linearGradient id="um-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2B7A9D"/>
                <stop offset="1" stop-color="#0E3B47"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="16" fill="url(#um-bg)"/>
            <path d="M19 15v19a13 13 0 0 0 26 0V15" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="19" cy="15" r="4.2" fill="#8FE0D3"/>
            <circle cx="45" cy="15" r="4.2" fill="#8FE0D3"/>
            <path d="M32 24v14M25 31h14" stroke="#E8896B" stroke-width="4.6" stroke-linecap="round"/>
          </svg>
          <span class="brand-word">Unify<span>Medic</span></span>
        </a>
      </div>
      <h1>Set a new password</h1>
      <p>Choose a strong password for your account.</p>
    </div>

    <div class="form-group">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" required />
      <div class="error-message" id="newPasswordError">Password must be at least 8 characters</div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
      <div class="error-message" id="confirmPasswordError">Passwords do not match</div>
    </div>

    <div class="error-message" id="apiError"></div>

    <button class="btn" id="resetBtn">Reset password</button>

    <div id="successMessage" class="success-message">
      ✅ Password reset successful. You can now log in.
    </div>

    <div class="back"><a href="login.html">Back to login</a></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const API_BASE = ''; // set to the backend's full origin if hosted separately
    const token = params.get('token') || '';
    const email = params.get('email') || '';

    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const newPasswordError = document.getElementById('newPasswordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const apiError = document.getElementById('apiError');
    const resetBtn = document.getElementById('resetBtn');
    const successMessage = document.getElementById('successMessage');

    function validatePassword(pw){ return typeof pw === 'string' && pw.length >= 8; }

    function clearErrors(){
      [newPassword, confirmPassword].forEach(i => i.classList.remove('error'));
      [newPasswordError, confirmPasswordError, apiError].forEach(e => e.classList.remove('show'));
    }

    if (!token || !email) {
      apiError.textContent = 'This reset link is invalid or missing. Please request a new one from the login page.';
      apiError.classList.add('show');
      resetBtn.disabled = true;
    }

    newPassword.addEventListener('input', clearErrors);
    confirmPassword.addEventListener('input', clearErrors);

    resetBtn.addEventListener('click', async () => {
      const pw = newPassword.value;
      const cpw = confirmPassword.value;

      let ok = true;
      if (!validatePassword(pw)) {
        newPassword.classList.add('error');
        newPasswordError.classList.add('show');
        ok = false;
      }
      if (pw !== cpw) {
        confirmPassword.classList.add('error');
        confirmPasswordError.classList.add('show');
        ok = false;
      }
      if (!ok) return;

      const originalText = resetBtn.textContent;
      resetBtn.textContent = 'Resetting...';
      resetBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/api/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, newPassword: pw })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.success) {
          apiError.textContent = data.message || 'This link may have expired. Please request a new one.';
          apiError.classList.add('show');
          resetBtn.textContent = originalText;
          resetBtn.disabled = false;
          return;
        }

        successMessage.classList.add('show');
        resetBtn.style.display = 'none';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (error) {
        apiError.textContent = 'Network error';
        apiError.classList.add('show');
        resetBtn.textContent = originalText;
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
